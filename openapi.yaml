        content:
          application/json:
            schema:
              type: object
              required: [id, action]
              properties:
                id: { type: integer }
                action: { type: string, enum: [planting, harvesting] }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/building/plantable:
    post:
      operationId: set_plantable_priority
      summary: Set the prioritized plantable on a forester/gatherer.
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, plantable]
              properties:
                id: { type: integer }
                plantable: { type: string, description: 'Plantable name; pass "none" to clear.' }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/building/workers:
    post:
      operationId: set_workers
      summary: Set desired worker count on a building (0..maxWorkers).
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, count]
              properties:
                id: { type: integer }
                count: { type: integer, minimum: 0 }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/building/range:
    post:
      operationId: building_range
      summary: Get the working-range tiles for a building (farmhouse, lumberjack, forester).
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
              additionalProperties: false
      responses:
        '200':
          description: Range tiles.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/building/storage:
    post:
      operationId: set_storage
      summary: Set storage mode and/or allowed good on a stockpile/warehouse.
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
                good: { type: string, description: 'Good name; pass "none" to clear.' }
                mode: { type: string, enum: [accept, obtain, supply, empty] }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/building/demolish:
    post:
      operationId: demolish_building
      summary: Demolish a building.
      tags: [placement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crop/demolish:
    post:
      operationId: demolish_crop
      summary: Demolish a planted crop entity.
      tags: [placement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/building/place:
    post:
      operationId: place_building
      summary: Place a building by prefab + coords + orientation.
      tags: [placement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefab, x, y, z]
              properties:
                prefab: { type: string }
                x: { type: integer }
                y: { type: integer }
                z: { type: integer }
                orientation: { type: string, enum: [north, south, east, west], default: south }
              additionalProperties: false
      responses:
        '200':
          description: Placement result.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/placement/find:
    post:
      operationId: find_placement
      summary: Find valid building placements in an area or radius.
      tags: [placement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefab]
              properties:
                prefab: { type: string }
                x1: { type: integer, default: 0 }
                y1: { type: integer, default: 0 }
                x2: { type: integer, default: 0 }
                y2: { type: integer, default: 0 }
                x:
                  type: integer
                  description: 'Centre X (combined with `y` + `radius`, in place of `x1/y1/x2/y2`).'
                y: { type: integer }
                radius:
                  type: integer
                  description: 'Manhattan radius around `x,y`. Defaults to `DefaultSearchRadius` (30).'
              additionalProperties: false
      responses:
        '200':
          description: Candidate placements sorted by path access.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/path/place:
    post:
      operationId: place_path
      summary: Route a path between two points using A* with auto-stairs.
      tags: [placement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x1, y1, x2, y2]
              properties:
                x1: { type: integer }
                y1: { type: integer }
                x2: { type: integer }
                y2: { type: integer }
                style: { type: string, enum: [direct, straight], default: direct }
                sections: { type: integer, minimum: 0, default: 0, description: '0 = place full path; N = stop after N stair crossings.' }
                timings: { type: boolean, default: false, description: 'If true, include profiling output in the response.' }
              additionalProperties: false
      responses:
        '200':
          description: Path placement result.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/planting/mark:
    post:
      operationId: plant_crop
      summary: Mark a rectangle for planting a specific crop.
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x1, y1, x2, y2, z, crop]
              properties:
                x1: { type: integer }
                y1: { type: integer }
                x2: { type: integer }
                y2: { type: integer }
                z: { type: integer }
                crop: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/planting/find:
    post:
      operationId: find_planting
      summary: Find valid planting spots for a crop, in a farmhouse range or rect.
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [crop]
              properties:
                crop: { type: string }
                id:
                  type: integer
                  description: 'Farmhouse id (uses the farmhouse range). Accepts `building_id` as an alias.'
                building_id: { type: integer, description: 'Alias for `id`.' }
                x1: { type: integer, default: 0 }
                y1: { type: integer, default: 0 }
                x2: { type: integer, default: 0 }
                y2: { type: integer, default: 0 }
                z: { type: integer, default: 0 }
              additionalProperties: false
      responses:
        '200':
          description: Candidate planting spots.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/planting/clear:
    post:
      operationId: clear_planting
      summary: Unmark planting in a rectangle.
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x1, y1, x2, y2, z]
              properties:
                x1: { type: integer }
                y1: { type: integer }
                x2: { type: integer }
                y2: { type: integer }
                z: { type: integer }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/cutting/area:
    post:
      operationId: mark_trees
      summary: Mark or clear a tree-cutting rectangle (covers both `mark_trees` and `clear_trees` client methods via the `marked` flag).
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x1, y1, x2, y2, z]
              properties:
                x1: { type: integer }
                y1: { type: integer }
                x2: { type: integer }
                y2: { type: integer }
                z: { type: integer }
                marked: { type: boolean, default: true }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/district/migrate:
    post:
      operationId: migrate
      summary: Migrate beavers between districts.
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string }
                count: { type: integer, minimum: 1, default: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/science/unlock:
    post:
      operationId: unlock_building
      summary: Spend science points to unlock a building.
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [building]
              properties:
                building: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/distribution:
    get:
      operationId: distribution
      summary: Import/export rules per district per good.
      tags: [read]
      x-timberbot-capabilities:
        supports_format: true
      parameters:
        - { $ref: '#/components/parameters/Format' }
      responses:
        '200':
          description: Distribution.
          content: { application/json: { schema: { $ref: '#/components/schemas/Distribution' } } }
    post:
      operationId: set_distribution
      summary: Set import/export rule for a good in a district.
      tags: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [district, good]
              properties:
                district: { type: string }
                good: { type: string }
                import:
                  type: string
                  description: '"Forced", "Auto", "None", or "" (leave unchanged).'
                exportThreshold:
                  type: integer
                  description: 'Export-above threshold. `-1` = leave unchanged.'
                  default: -1
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------------------
  # automation wiring
  # ---------------------------------------------------------------------------
  /api/automation/link:
    post:
      operationId: link
      summary: Wire a sensor/relay output to a building automation input.
      tags: [automation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, targetId]
              properties:
                sourceId: { type: integer }
                targetId: { type: integer }
                input:
                  type: string
                  enum: [a, b, reset]
                  default: a
                  description: 'Input port (Memory components support "reset").'
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/automation/unlink:
    post:
      operationId: unlink
      summary: Disconnect an automation input.
      tags: [automation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
                input:
                  type: string
                  enum: [a, b, reset]
                  default: a
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/automation/configure:
    post:
      operationId: configure_automation
      summary: Set a property on an automation component (threshold, mode, …).
      tags: [automation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, property, value]
              properties:
                id: { type: integer }
                property: { type: string }
                value: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/automation/rename:
    post:
      operationId: rename_automation
      summary: Set a custom label on an automation entity.
      tags: [automation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: integer }
                name: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  # /api/webhooks and /api/webhooks/delete were deleted in the WS rework
  # (issue #28). Game-event push delivery now flows over the same WebSocket
  # channel as state snapshots; subscribers connect once to /api/ws and
  # receive `event` frames in real time. See docs/websocket-protocol.md.

  # ---------------------------------------------------------------------------
  # debug / benchmark (gated by debugEndpointEnabled)
  # ---------------------------------------------------------------------------
  /api/debug:
    post:
      operationId: debug
      summary: Reflection-based live inspector.
      description: |
        Disabled by default (set `debugEndpointEnabled: true` in `settings.json`).
        Accepts a free-form body with a `target` discriminator (`help`, `roots`,
        `get`, `fields`, `describe`, `call`, `compare`, `assert`,
        `validate`, `validate_all`) plus target-specific extra fields.
      tags: [debug]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string }
              additionalProperties: true
      responses:
        '200':
          description: Inspector output.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/benchmark:
    post:
      operationId: benchmark
      summary: Run a benchmark loop over a debug target.
      tags: [debug]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                iterations: { type: integer, minimum: 1, default: 100 }
              additionalProperties: true
      responses:
        '200':
          description: Benchmark result.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '400': { $ref: '#/components/responses/BadRequest' }

openapi: 3.1.0
info:
  title: Timberbot HTTP API
  description: |
    Read/write HTTP API for the Timberbot Timberborn mod. The mod binds to
    `http://localhost:8085` by default and exposes the colony state for AI
    agents and scripts.

    This spec is the single source of truth for the HTTP contract. Both
    sides have contract tests that diff against it:

    - **C# side** (`timberbot/test/OpenApiContractTests.cs`) walks the route
      tables in `TimberbotHttpServer.cs` and asserts every route is in the
      spec (and vice versa).
    - **Python side** (`python/tests/test_openapi_spec.py`) validates the
      document, asserts unique operationIds, and asserts every operationId
      has a corresponding `TimberbotClient` method.

    All 26 GET response schemas are fully typed with `required` constraints,
    `$ref` composition, and `allOf` inheritance for paginated envelopes.
    Golden JSON fixtures in `python/tests/fixtures/openapi/` are validated
    against the spec by both Python (`test_openapi_responses.py`) and C#
    (`OpenApiResponseShapeTests.cs`) contract tests.

    ## Ready gate (HTTP 409)

    The mod ships with a Launch / Stop gate. Until the player presses
    Launch in the in-game widget (or a client toggles `POST /api/ready`
    with `{"ready": true}`), **every `/api/*` route returns HTTP 409**
    with the `GameNotReady` body documented in `components/responses`,
    except the carve-out: `/api/agent/*`, `/api/ready`, and `/api/ping`.
    Operations in this spec do not enumerate the 409 individually — it is
    a uniform gate. The WebSocket channel runs on a separate port
    (`wsPort` in settings.json, default 8086) and is documented in
    `docs/websocket-protocol.md`.
  version: 1.0.0
  contact:
    name: Timberbot
    url: https://github.com/impuls42/timberbot
  license:
    name: MIT
servers:
  - url: http://localhost:8085
    description: Default local mod listener (override via settings.json httpPort/listenAddress).

tags:
  - name: meta
    description: Health, identity, ping.
  - name: read
    description: Read game state (snapshots, scalars).
  - name: read-list
    description: Read list endpoints with pagination/filter capabilities.
  - name: write
    description: Mutating actions (paused/queued onto the main thread).
  - name: placement
    description: A* path routing and building placement.
  - name: automation
    description: Sensor/relay/memory wiring (`Automator`/`Automatable`).
  - name: debug
    description: Reflection inspector + benchmark (gated by `debugEndpointEnabled`).
  - name: agent
    description: Widget-facing agent state, configuration, and request gate.

security:
  # When `authToken` is configured in `settings.json`, every /api/* route
  # except `/api/ping` requires `Authorization: Bearer <token>`. Operations
  # that opt out (only `/api/ping`) override this with `security: []`.
  # An empty `authToken` disables enforcement entirely — only safe for
  # loopback (127.0.0.1 / localhost) binds; the mod refuses to start if
  # `listenAddress` is non-loopback and `authToken` is empty.
  - bearer: []

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Shared-secret bearer token. The mod compares the presented token to
        `authToken` from `settings.json` using a constant-time compare
        (`CryptographicOperations.FixedTimeEquals`). Missing or mismatched
        tokens get `401 Unauthorized` with `WWW-Authenticate: Bearer realm="timberbot"`.
        Configure the Python client via `TimberbotClient(auth_token=...)`,
        the `TBOT_AUTH_TOKEN` env var, or `[client].auth_token` in
        `~/.config/timberbot/config.toml`.
  parameters:
    Format:
      name: format
      in: query
      description: |
        `toon` (default) returns the compact TOON CSV-like rendering for
        AI/CLI consumption. `json` returns the full nested JSON.
      required: false
      schema: { type: string, enum: [toon, json], default: toon }
    Limit:
      name: limit
      in: query
      description: Pagination page size. `0` = unlimited. Defaults to `100`.
      required: false
      schema: { type: integer, minimum: 0, default: 100 }
    Offset:
      name: offset
      in: query
      description: Pagination offset.
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Detail:
      name: detail
      in: query
      description: |
        `basic` (default) returns compact fields; `full` returns all fields
        including inventories/needs. Use `id:<n>` as a shorthand for
        `?id=<n>&detail=full`.
      required: false
      schema: { type: string, enum: [basic, full], default: basic }
    Id:
      name: id
      in: query
      description: Single-entity lookup by integer ID.
      required: false
      schema: { type: integer }
    NameFilter:
      name: name
      in: query
      description: Server-side substring filter on the entity name.
      required: false
      schema: { type: string }
    X:
      name: x
      in: query
      description: Proximity-filter centre, X coordinate.
      required: false
      schema: { type: integer }
    Y:
      name: y
      in: query
      description: Proximity-filter centre, Y coordinate.
      required: false
      schema: { type: integer }
    Radius:
      name: radius
      in: query
      description: Proximity-filter Manhattan radius (requires X and Y).
      required: false
      schema: { type: integer, minimum: 0 }
    TileX1:
      name: x1
      in: query
      schema: { type: integer }
    TileY1:
      name: y1
      in: query
      schema: { type: integer }
    TileX2:
      name: x2
      in: query
      schema: { type: integer }
    TileY2:
      name: y2
      in: query
      schema: { type: integer }

  schemas:
    # Response shapes are derived from golden fixtures captured against a
    # running mod (see python/tests/fixtures/openapi/). Object schemas keep
    # `additionalProperties: true` so future server additions don't break
    # clients; `required` lists fields the server is contracted to emit.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 'Error code, e.g. `not_found: id 42`.' }
      additionalProperties: true
    PingResponse:
      type: object
      required: [status, ready, openapiVersion]
      properties:
        status: { type: string, example: ok }
        ready: { type: boolean }
        openapiVersion: { type: string, description: 'Spec version the server speaks.' }
      additionalProperties: false
    SettlementName:
      type: object
      required: [name]
      properties:
        name: { type: string }
      additionalProperties: false
    StatusResult:
      description: Generic mutation acknowledgement.
      type: object
      additionalProperties: true

    # --- Shared component schemas ---
    Population:
      type: array
      items: { $ref: '#/components/schemas/PopulationItem' }
    PopulationItem:
      type: object
      required: [district, adults, children, bots]
      properties:
        district: { type: string }
        adults: { type: integer, minimum: 0 }
        children: { type: integer, minimum: 0 }
        bots: { type: integer, minimum: 0 }
      additionalProperties: true
    PopulationCounts:
      type: object
      required: [adults, children, bots]
      properties:
        adults: { type: integer, minimum: 0 }
        children: { type: integer, minimum: 0 }
        bots: { type: integer, minimum: 0 }
      additionalProperties: true
    GoodStock:
      type: object
      required: [available, all]
      properties:
        available: { type: integer }
        all: { type: integer }
      additionalProperties: true
    DistrictResources:
      description: Map of good name → stock counts.
      type: object
      additionalProperties: { $ref: '#/components/schemas/GoodStock' }
    Resources:
      description: Map of district name → DistrictResources.
      type: object
      additionalProperties: { $ref: '#/components/schemas/DistrictResources' }

    Time:
      type: object
      required: [dayNumber, dayProgress, partialDayNumber]
      properties:
        dayNumber: { type: integer, minimum: 0 }
        dayProgress: { type: number, minimum: 0, maximum: 1 }
        partialDayNumber: { type: number, minimum: 0 }
      additionalProperties: true
    Weather:
      type: object
      required: [cycle, cycleDay, cycleLengthInDays, isHazardous, temperateWeatherDuration, hazardousWeatherDuration]
      properties:
        cycle: { type: integer, minimum: 0 }
        cycleDay: { type: integer, minimum: 0 }
        cycleLengthInDays: { type: integer, minimum: 1 }
        isHazardous: { type: boolean }
        temperateWeatherDuration: { type: integer, minimum: 0 }
        hazardousWeatherDuration: { type: integer, minimum: 0 }
      additionalProperties: true
    WorkHours:
      type: object
      required: [endHours, areWorkingHours]
      properties:
        endHours: { type: number, minimum: 0 }
        areWorkingHours: { type: boolean }
      additionalProperties: true
    Speed:
      type: object
      required: [speed]
      properties:
        speed: { type: integer, enum: [0, 1, 2, 3] }
      additionalProperties: true

    # --- Summary (aggregated snapshot) ---
    Summary:
      description: 'Aggregated snapshot: time + weather + districts + key totals.'
      type: object
      required: [settlement, faction, time, weather, districts, science]
      properties:
        settlement: { type: string }
        faction: { type: string }
        science: { type: integer, minimum: 0 }
        alerts:
          description: Map of alert type → count.
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        buildings:
          description: Building totals grouped by category.
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        crops:
          type: object
          properties:
            growing: { type: integer, minimum: 0 }
            ready: { type: integer, minimum: 0 }
            species:
              type: array
              items: { type: string }
          additionalProperties: true
        districts:
          type: array
          items: { $ref: '#/components/schemas/SummaryDistrict' }
        foodClusters:
          type: array
          items: { $ref: '#/components/schemas/Cluster' }
        treeClusters:
          type: array
          items: { $ref: '#/components/schemas/Cluster' }
        time: { $ref: '#/components/schemas/SummaryTime' }
        weather: { $ref: '#/components/schemas/SummaryWeather' }
      additionalProperties: true
    SummaryTime:
      type: object
      properties:
        dayNumber: { type: integer, minimum: 0 }
        dayProgress: { type: number, minimum: 0, maximum: 1 }
        partialDayNumber: { type: number, minimum: 0 }
        speed: { type: integer, enum: [0, 1, 2, 3] }
      additionalProperties: true
    SummaryWeather:
      type: object
      properties:
        cycle: { type: integer, minimum: 0 }
        cycleDay: { type: integer, minimum: 0 }
        cycleLengthInDays: { type: integer, minimum: 1 }
        isHazardous: { type: boolean }
        temperateWeatherDuration: { type: integer, minimum: 0 }
        hazardousWeatherDuration: { type: integer, minimum: 0 }
      additionalProperties: true
    SummaryDistrict:
      type: object
      required: [name, population]
      properties:
        name: { type: string }
        population: { $ref: '#/components/schemas/PopulationCounts' }
        resources:
          description: Map of good → stock count (summary aggregate, simpler than /api/resources).
          type: object
          additionalProperties: { type: integer }
        housing:
          type: object
          properties:
            occupiedBeds: { type: integer, minimum: 0 }
            totalBeds: { type: integer, minimum: 0 }
            homeless: { type: integer, minimum: 0 }
          additionalProperties: true
        employment:
          type: object
          properties:
            assigned: { type: integer, minimum: 0 }
            vacancies: { type: integer, minimum: 0 }
            unemployed: { type: integer, minimum: 0 }
          additionalProperties: true
        wellbeing:
          type: object
          properties:
            average: { type: number }
            critical: { type: integer, minimum: 0 }
            miserable: { type: integer, minimum: 0 }
          additionalProperties: true
        dc:
          description: District Center location/orientation.
          type: object
          properties:
            x: { type: integer }
            y: { type: integer }
            z: { type: integer }
            entranceX: { type: integer }
            entranceY: { type: integer }
            orientation: { type: string }
          additionalProperties: true
      additionalProperties: true

    # --- Districts ---
    DistrictList:
      type: array
      items: { $ref: '#/components/schemas/District' }
    District:
      type: object
      required: [name, population]
      properties:
        name: { type: string }
        population: { $ref: '#/components/schemas/PopulationCounts' }
        resources: { $ref: '#/components/schemas/DistrictResources' }
      additionalProperties: true

    # --- Distribution ---
    Distribution:
      type: array
      items: { $ref: '#/components/schemas/DistrictDistribution' }
    DistrictDistribution:
      type: object
      required: [district, goods]
      properties:
        district: { type: string }
        goods:
          type: array
          items: { $ref: '#/components/schemas/GoodDistribution' }
      additionalProperties: true
    GoodDistribution:
      type: object
      required: [good, importOption, exportThreshold]
      properties:
        good: { type: string }
        importOption:
          type: string
          enum: [Forced, Auto, None]
        exportThreshold: { type: number }
      additionalProperties: true

    # --- Science ---
    Science:
      type: object
      required: [points, unlockables]
      properties:
        points: { type: integer, minimum: 0 }
        unlockables:
          type: array
          items: { $ref: '#/components/schemas/Unlockable' }
      additionalProperties: true
    Unlockable:
      type: object
      required: [name, cost, unlocked]
      properties:
        name: { type: string }
        cost: { type: integer, minimum: 0 }
        unlocked: { type: integer, enum: [0, 1] }
      additionalProperties: true

    # --- Wellbeing ---
    WellbeingReport:
      type: object
      required: [beavers, categories]
      properties:
        beavers: { type: integer, minimum: 0 }
        categories:
          type: array
          items: { $ref: '#/components/schemas/WellbeingCategory' }
      additionalProperties: true
    WellbeingCategory:
      type: object
      required: [group, current, max, needs]
      properties:
        group: { type: string }
        current: { type: number }
        max: { type: number }
        needs:
          type: array
          items: { $ref: '#/components/schemas/WellbeingNeed' }
      additionalProperties: true
    WellbeingNeed:
      type: object
      required: [id, favorableWellbeing, unfavorableWellbeing]
      properties:
        id: { type: string }
        favorableWellbeing: { type: number }
        unfavorableWellbeing: { type: number }
      additionalProperties: true

    # --- Notifications & alerts ---
    Notifications:
      type: array
      items: { $ref: '#/components/schemas/Notification' }
    Notification:
      type: object
      required: [subject, description, cycle, cycleDay]
      properties:
        subject: { type: string, description: 'Localization key or notification identifier.' }
        description: { type: string }
        cycle: { type: integer, minimum: 0 }
        cycleDay: { type: integer, minimum: 0 }
        entityId: { type: integer, description: 'Building/beaver entity this notification refers to, when applicable.' }
      additionalProperties: true
    Alerts:
      type: array
      items: { $ref: '#/components/schemas/Alert' }
    Alert:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, description: 'Alert category (e.g. unstaffed, unpowered, unreachable, status).' }
        id: { type: integer, description: 'Building entity ID raising the alert.' }
        name: { type: string }
        workers:
          type: string
          description: Optional context (e.g. assigned/desired counts for staffing alerts).
      additionalProperties: true

    # --- Prefabs ---
    Prefabs:
      type: array
      items: { $ref: '#/components/schemas/Prefab' }
    Prefab:
      type: object
      required: [name, sizeX, sizeY, sizeZ]
      properties:
        name: { type: string }
        sizeX: { type: integer, minimum: 1 }
        sizeY: { type: integer, minimum: 1 }
        sizeZ: { type: integer, minimum: 1 }
        scienceCost: { type: integer, minimum: 0 }
        unlocked: { type: boolean }
        cost:
          type: array
          items: { $ref: '#/components/schemas/PrefabCost' }
      additionalProperties: true
    PrefabCost:
      type: object
      required: [good, amount]
      properties:
        good: { type: string }
        amount: { type: integer, minimum: 0 }
      additionalProperties: true

    # --- Power ---
    PowerNetworks:
      type: array
      items: { $ref: '#/components/schemas/PowerNetwork' }
    PowerNetwork:
      type: object
      required: [id, supply, demand, buildings]
      properties:
        id: { type: integer }
        supply: { type: number }
        demand: { type: number }
        buildings:
          type: array
          items: { $ref: '#/components/schemas/PowerBuilding' }
      additionalProperties: true
    PowerBuilding:
      type: object
      required: [id, name, isGenerator, nominalInput, nominalOutput]
      properties:
        id: { type: integer }
        name: { type: string }
        isGenerator: { type: integer, enum: [0, 1] }
        nominalInput: { type: number }
        nominalOutput: { type: number }
      additionalProperties: true

    # --- Tiles ---
    Tiles:
      type: object
      required: [mapSize]
      properties:
        mapSize:
          type: object
          required: [x, y, z]
          properties:
            x: { type: integer, minimum: 1 }
            y: { type: integer, minimum: 1 }
            z: { type: integer, minimum: 1 }
          additionalProperties: true
        tiles:
          description: Per-tile data for the requested rectangle (when bounds are provided).
          type: array
          items: { type: object, additionalProperties: true }
      additionalProperties: true

    # --- Clusters (tree_clusters / food_clusters) ---
    TreeClusters:
      type: array
      items: { $ref: '#/components/schemas/Cluster' }
    FoodClusters:
      type: array
      items: { $ref: '#/components/schemas/Cluster' }
    Cluster:
      type: object
      required: [x, y, z, total, grown, species]
      properties:
        x: { type: integer }
        y: { type: integer }
        z: { type: integer }
        total: { type: integer, minimum: 0 }
        grown: { type: integer, minimum: 0 }
        species:
          description: Map of species name → count.
          type: object
          additionalProperties: { type: integer, minimum: 0 }
      additionalProperties: true

    # --- Paginated list envelopes ---
    PaginatedEnvelope:
      type: object
      required: [total, offset, limit, items]
      properties:
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        items:
          type: array
          items: { type: object, additionalProperties: true }
      additionalProperties: true
    BuildingList:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Building' }
    BeaverList:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Beaver' }
    TreeList:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Plant' }
    CropList:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Plant' }
    GatherableList:
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Gatherable' }
    EntityList:
      description: Deprecated alias for the paginated envelope; concrete list endpoints have their own typed envelopes (BuildingList, BeaverList, TreeList, CropList, GatherableList).
      allOf:
        - $ref: '#/components/schemas/PaginatedEnvelope'

    # --- Entities ---
    Building:
      type: object
      required: [id, name, x, y, z, orientation, finished, paused]
      properties:
        id: { type: integer }
        name: { type: string }
        x: { type: integer }
        y: { type: integer }
        z: { type: integer }
        orientation:
          type: string
          enum: [south, west, north, east]
        finished: { type: integer, enum: [0, 1] }
        paused: { type: integer, enum: [0, 1] }
        pausable: { type: integer, enum: [0, 1] }
        constructionPriority: { type: string, enum: [VeryLow, Low, Normal, High, VeryHigh] }
        workplacePriority: { type: string, enum: [VeryLow, Low, Normal, High, VeryHigh] }
        maxWorkers: { type: integer, minimum: 0 }
        desiredWorkers: { type: integer, minimum: 0 }
        assignedWorkers: { type: integer, minimum: 0 }
        reachable: { type: integer, enum: [0, 1] }
        powered: { type: integer, enum: [0, 1] }
        isGenerator: { type: integer, enum: [0, 1] }
        isConsumer: { type: integer, enum: [0, 1] }
        nominalPowerInput: { type: number }
        nominalPowerOutput: { type: number }
        powerDemand: { type: number }
        powerSupply: { type: number }
        buildProgress: { type: number, minimum: 0, maximum: 1 }
        materialProgress: { type: number, minimum: 0, maximum: 1 }
        hasMaterials: { type: integer, enum: [0, 1] }
        stock: { type: integer }
        capacity: { type: integer }
        storageMode: { type: string }
        allowedGood: { type: string }
        dwellers: { type: integer, minimum: 0 }
        maxDwellers: { type: integer, minimum: 0 }
        floodgate: { type: integer, enum: [0, 1] }
        height: { type: number }
        maxHeight: { type: number }
        isClutch: { type: integer, enum: [0, 1] }
        clutchEngaged: { type: integer, enum: [0, 1] }
        currentRecipe: { type: string }
        productionProgress: { type: number, minimum: 0, maximum: 1 }
        readyToProduce: { type: integer, enum: [0, 1] }
        needsNutrients: { type: integer, enum: [0, 1] }
        nutrients: { type: integer }
        effectRadius: { type: integer, minimum: 0 }
        isWonder: { type: integer, enum: [0, 1] }
        wonderActive: { type: integer, enum: [0, 1] }
        alerts: { type: string, description: 'Comma-joined alert types active on this building.' }
        inventory:
          type: object
          additionalProperties: { type: integer }
        recipes:
          type: array
          items: { type: string }
        automation: { $ref: '#/components/schemas/BuildingAutomation' }
      additionalProperties: true
    BuildingAutomation:
      type: object
      properties:
        type: { type: string }
        hasAutomator: { type: integer, enum: [0, 1] }
        automatorName: { type: string }
        isAutomated: { type: integer, enum: [0, 1] }
        isTransmitter: { type: integer, enum: [0, 1] }
        state: { type: string }
        inputName: { type: string }
        inputs:
          type: array
          items: { type: object, additionalProperties: true }
        outputs:
          type: array
          items: { type: object, additionalProperties: true }
        config:
          type: object
          additionalProperties: true
      additionalProperties: true

    Beaver:
      type: object
      required: [id, name, x, y, z, district, isBot]
      properties:
        id: { type: integer }
        name: { type: string }
        district: { type: string }
        x: { type: integer }
        y: { type: integer }
        z: { type: integer }
        isBot: { type: integer, enum: [0, 1] }
        contaminated: { type: integer, enum: [0, 1] }
        deterioration: { type: number }
        hasHome: { type: integer, enum: [0, 1] }
        lifeProgress: { type: number, minimum: 0, maximum: 1 }
        liftingCapacity: { type: integer, minimum: 0 }
        carryAmount: { type: integer, minimum: 0 }
        carrying: { type: string }
        overburdened: { type: integer, enum: [0, 1] }
        anyCritical: { type: integer, enum: [0, 1] }
        workplace: { type: string }
        wellbeing: { type: integer }
        needs:
          type: array
          items: { $ref: '#/components/schemas/BeaverNeed' }
      additionalProperties: true
    BeaverNeed:
      type: object
      required: [id, group, points, wellbeing, favorable, critical]
      properties:
        id: { type: string }
        group: { type: string }
        points: { type: number, description: "Fulfillment level; negative for unfavorable needs that drain wellbeing." }
        wellbeing: { type: integer }
        favorable: { type: integer, enum: [0, 1] }
        critical: { type: integer, enum: [0, 1] }
      additionalProperties: true

    Plant:
      description: Tree or planted crop entity (shared shape).
      type: object
      required: [id, name, x, y, z, alive]
      properties:
        id: { type: integer }
        name: { type: string }
        x: { type: integer }
        y: { type: integer }
        z: { type: integer }
        alive: { type: integer, enum: [0, 1] }
        grown: { type: integer, enum: [0, 1] }
        growth: { type: number, minimum: 0, maximum: 1 }
        marked: { type: integer, enum: [0, 1] }
      additionalProperties: true

    Gatherable:
      type: object
      required: [id, name, x, y, z, alive]
      properties:
        id: { type: integer }
        name: { type: string }
        x: { type: integer }
        y: { type: integer }
        z: { type: integer }
        alive: { type: integer, enum: [0, 1] }
      additionalProperties: true

    AgentStatus:
      type: object
      additionalProperties: true

    # --- Agent / connector state (mod ↔ connector rework) ---
    AgentMode:
      type: string
      enum: [autonomous, request]
      description: |
        `autonomous` lets the connector decide cadence; `request` waits for
        the player to type a prompt and press Launch. Default = `request`.
    PendingRequest:
      description: Single-slot prompt waiting to be picked up by the connector.
      type: object
      required: [id, prompt]
      properties:
        id: { type: integer, minimum: 1, description: 'Monotonic request id. Connectors ack with `acked_request_id` >= this value.' }
        prompt: { type: string }
      additionalProperties: false
    AgentState:
      description: |
        Full widget/connector state snapshot returned by `/api/agent/state`
        and pushed as a `state` frame on the WebSocket channel
        (`ws://host:wsPort/api/ws`).
      type: object
      required: [mode, goal, ready, pendingRequest, agentStatus, lastError]
      properties:
        mode: { $ref: '#/components/schemas/AgentMode' }
        goal: { type: string, description: 'Free-form objective text.' }
        ready: { type: boolean, description: 'Launch gate. False until the player presses Launch in the widget.' }
        pendingRequest:
          oneOf:
            - { $ref: '#/components/schemas/PendingRequest' }
            - { type: 'null' }
        agentStatus: { type: string, description: 'Connector-reported status string (free-form).' }
        lastError:
          description: Most recent fatal error reported by the connector. `null` if no error has been reported in this session.
          oneOf:
            - { type: string }
            - { type: 'null' }
      additionalProperties: true
    AgentRequestAck:
      type: object
      required: [pendingRequest]
      properties:
        pendingRequest: { $ref: '#/components/schemas/PendingRequest' }
      additionalProperties: true
    ReadyAck:
      type: object
      required: [ready]
      properties:
        ready: { type: boolean }
      additionalProperties: true
    GameNotReady:
      description: |
        Returned with HTTP 409 from any non-whitelisted `/api/*` route while
        `ready=false`. The whitelist is `/api/agent/*`, `/api/ready`, and
        `/api/ping`. The WebSocket channel (`ws://host:wsPort/api/ws`) is not
        gated; subscribers see the gate transition as a `state` frame.
      type: object
      required: [error, hint]
      properties:
        error: { type: string, enum: [game_not_ready] }
        hint: { type: string }
      additionalProperties: false

  responses:
    BadRequest:
      description: Malformed body or invalid parameters.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Entity or endpoint not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ServerError:
      description: Internal mod error (logged to `Documents/Timberborn/Mods/Timberbot/timberbot.log`).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    BodyTooLarge:
      description: Request body exceeded `maxBodyBytes` from settings.json.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    GameNotReady:
      description: |
        Player has not pressed Launch yet. All non-whitelisted `/api/*`
        routes (reads and writes) return this until `ready=true`.
      content: { application/json: { schema: { $ref: '#/components/schemas/GameNotReady' } } }
    Unauthorized:
      description: |
        Missing or invalid `Authorization: Bearer <token>` header. The mod
        enforces auth on every `/api/*` route except `/api/ping` whenever
        `authToken` is non-empty in `settings.json`. Response includes
        `WWW-Authenticate: Bearer realm="timberbot"`.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer realm="timberbot"' }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

paths:
  # ---------------------------------------------------------------------------
  # meta
  # ---------------------------------------------------------------------------
  /api/ping:
    get:
      operationId: ping
      summary: Liveness check.
      description: |
        Returns `{status: ok, ready: true}` when the mod is loaded into a game session.

        Unauthenticated even when `authToken` is configured — clients use
        this endpoint to probe liveness and the OpenAPI version before they
        know an auth token is required.
      tags: [meta]
      security: []
      responses:
        '200':
          description: Mod is alive and a game is loaded.
          content: { application/json: { schema: { $ref: '#/components/schemas/PingResponse' } } }
  /api/settlement:
    get:
      operationId: settlement
      summary: Current settlement name.
      tags: [meta]
      responses:
        '200':
          description: Settlement identity.
          content: { application/json: { schema: { $ref: '#/components/schemas/SettlementName' } } }

  # ---------------------------------------------------------------------------
  # agent / connector surface (gate-exempt)
  # ---------------------------------------------------------------------------
  /api/agent/state:
    get:
      operationId: agent_state
      summary: Widget-facing agent state snapshot.
      description: |
        Always live (gate-exempt). Mirrors the heartbeat response so the widget
        and the connector can share parsers.
      tags: [agent]
      responses:
        '200':
          description: Current agent state.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentState' } } }

  /api/agent/config:
    post:
      operationId: agent_config
      summary: Update persisted agent configuration (mode and/or goal).
      description: |
        Widget save (debounced). Either or both fields may be omitted to
        leave the corresponding value untouched.
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { $ref: '#/components/schemas/AgentMode' }
                goal: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: Updated agent state.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentState' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/agent/request:
    post:
      operationId: agent_request
      summary: Submit a new prompt to the single pending-request slot.
      description: |
        Launch trigger in request mode. Records the prompt in the pending
        slot. Connected `tbot watch` clients see the new `pendingRequest`
        immediately via a `state` frame on the WebSocket channel; polling
        `/api/agent/state` is the slow-path fallback for HTTP-only clients.
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Pending request slot updated.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentRequestAck' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/ready:
    post:
      operationId: ready
      summary: Toggle the Launch / Stop ready gate.
      description: |
        Setting `ready=false` causes every non-whitelisted `/api/*` route
        (reads AND writes) to return 409 `game_not_ready` until the player
        re-Launches in the widget. `ready` is intentionally not persisted —
        the gate is closed on every game load.
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ready]
              properties:
                ready: { type: boolean }
              additionalProperties: false
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReadyAck' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  # /api/tbot/register and /api/tbot/heartbeat were deleted in the WS rework
  # (issue #28). Connectors now upgrade to ws://host:wsPort/api/ws and
  # exchange `state`, `event`, `heartbeat`, `ping`, `pong` frames. See
  # docs/websocket-protocol.md for the authoritative protocol.


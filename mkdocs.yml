site_name: Timberbot API
site_description: Full read/write HTTP API for controlling Timberborn with AI (modified fork of abix-/TimberbornMods)
site_url: https://impuls42.github.io/timberbot/
repo_url: https://github.com/impuls42/timberbot
repo_name: impuls42/timberbot
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/impuls42/timberbot
    - icon: fontawesome/brands/github-alt
      link: https://github.com/abix-/TimberbornMods
      name: Upstream (abix-/TimberbornMods)
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - API Reference: api-reference.md
  - Timberbot Guide: timberbot.md
  - Features: features.md
  - Events: events.md
  - WebSocket Protocol: websocket-protocol.md
  - Architecture: architecture.md
  - Performance: performance.md
  - macOS Testing: macos-testing.md
  - Developing: developing.md
  - Dev Environment: devenv.md
  - Changelog: unreleased.md

copyright: Timberbot API &mdash; Play Timberborn with an AI &middot; Modified fork of <a href="https://github.com/abix-/TimberbornMods">abix-/TimberbornMods</a>

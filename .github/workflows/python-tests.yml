name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'python/**'
              - '.github/workflows/python-tests.yml'

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: pip install -e 'python/[dev]'

      - name: Lint (ruff)
        run: ruff check python/

      - name: Test (pytest)
        working-directory: python
        run: pytest -q

  # Build a wheel + sdist on every PR/push that touches the Python package and
  # upload as a workflow artifact. Reviewers can grab it from the PR's "Checks"
  # tab and `pip install` the proposed changes locally without a release.
  # Separate from `test` so we only build once (not per matrix entry) and only
  # if the tests passed. Failures here are informational, not gating — they
  # don't feed into `python-tests-required`.
  package:
    needs: [changes, test]
    if: needs.changes.outputs.relevant == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Build sdist + wheel
        working-directory: python
        run: |
          pip install --upgrade build
          python -m build
      - name: Upload wheel + sdist
        uses: actions/upload-artifact@v4
        with:
          # Tag with PR number when available, otherwise the commit SHA, so
          # multiple in-flight branches don't collide on the artifact name.
          name: timberbot-py-${{ github.event.pull_request.number || github.sha }}
          path: python/dist/*
          retention-days: 14
          if-no-files-found: error

  python-tests-required:
    name: python-tests-required
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on test result
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes job did not succeed (was: ${{ needs.changes.result }}) — refusing to pass without verifying test outcome"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]]; then
            echo "Python tests failed"
            exit 1
          fi
          echo "OK (tests passed or skipped — no relevant changes)"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "timberbot"
version = "0.9.0"
description = "Python client and `tbot` CLI for the Timberbot Timberborn HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Timberbot contributors" },
]
keywords = ["timberborn", "timberbot", "modding", "ai-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "requests>=2.33.1",
  "toons>=0.5.4",
  "pydantic>=2.6",
  # `tbot listen` runs an aiohttp webhook receiver. aiohttp is also a natural
  # fit for the upcoming `tbot watch` connector (async polling + outbound
  # batching).
  "aiohttp>=3.9",
  # `tomllib` is stdlib on 3.11+; `tomli` provides the same API for 3.10.
  "tomli>=2.0; python_version < '3.11'",
  # The `tbot` dispatcher uses python-fire to reflect TimberbotClient methods
  # and the built-in subcommands into a single CLI surface.
  "fire>=0.7",
]

[project.optional-dependencies]
serve = [
  "agent-client-protocol>=0.10",
  "fastmcp>=2.0",
  "python-telegram-bot[asyncio]>=21.0",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-httpserver>=1.0",
  "mypy>=1.8",
  "ruff>=0.5",
  "openapi-spec-validator>=0.7",
  "pyyaml>=6.0",
  # Used by the integration suite (`validation_runner.py` decorates with
  # @override). Native in 3.12+ but tbot supports 3.10/3.11 too.
  "typing-extensions>=4.5",
]

[project.urls]
Homepage = "https://github.com/impuls42/timberbot"
Issues = "https://github.com/impuls42/timberbot/issues"

[project.scripts]
tbot = "timberbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/timberbot"]

[tool.hatch.build.targets.sdist]
include = [
  "src/timberbot",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skip integration tests by default. To run them: pass `-m integration`
# (requires a live Timberborn + Timberbot mod listening on localhost:8085).
addopts = "-ra --strict-markers -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: hits a live Timberbot mod; skipped without --tbot-host or a local game.",
  "live_game: alias kept for clarity (every integration test is also live_game).",
  "slow: runs > 30s; covered by integration but split out for perf/concurrency suites.",
  # Group markers mirroring validation_runner.TestRunner.GROUPS:
  "read: read-side endpoints (summary, time, weather, …).",
  "write: mutating endpoints (speed, priority, recipe, …).",
  "placement: building/path placement.",
  "automation: automation wiring (sensors, relays, memory).",
  "webhooks: webhook registration / delivery.",
  "perf: latency benchmarks.",
  "concurrency: multi-threaded fan-out.",
  "path: path-finding (A*, sections, errors).",
  "buildings: building-specific behaviors.",
  "beavers: beaver-specific behaviors.",
  "crops: crop planting + demolish.",
  "cli: subprocess CLI behavior.",
  "security: allowlist / CORS / body-size guards.",
  "wipe: destructive cleanup paths.",
  "ungrouped: TestRunner.test_* methods not in any GROUPS entry.",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# The integration runners (`v2_runner.py`, `validation_runner.py`) are moved
# wholesale from the legacy `timberbot/script/test_*.py` files. They predate
# the package and use idioms ruff flags (== True comparisons, type() == X,
# old-style imports). Conversion to flat pytest functions is a follow-up
# task; until then, the integration directory is held to a lighter lint bar.
[tool.ruff.lint.per-file-ignores]
"tests/integration/v2_runner.py" = ["E712", "E721", "I001", "SIM"]
"tests/integration/validation_runner.py" = ["E712", "E721", "I001", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
